version: '3.8'

services:
  mongo:
    image: mongodb/mongodb-community-server:latest
    container_name: mongo
    ports:
      - "27017:27017"

  auth-service:
    build: ./auth-service
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/authdb
      - JWT_SECRET=mysecretkey123
    depends_on:
      - mongo

  core-service:
    build: ./core-service
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGO_URI=mongodb://mongo:27017/coredb
      - JWT_SECRET=mysecretkey123
    depends_on:
      - mongo

  payment-service:
    build: ./payment-service
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - JWT_SECRET=mysecretkey123
    depends_on:
      - mongo